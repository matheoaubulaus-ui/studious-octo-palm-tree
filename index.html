<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Réservation du Deuxième Mercredi</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial, sans-serif;
}

body{
  /* beige background with a subtle repeating heart SVG pattern */
  background-color:#f6ead3;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><path fill='%23d66f83' d='M23.6 4c-2.4 0-4.6 1.4-5.6 3.4C16.6 5.4 14.4 4 12 4 7.6 4 4 7.6 4 12c0 6.2 12 14 12 14s12-7.8 12-14c0-4.4-3.6-8-8.4-8z'/></svg>");
  background-repeat: repeat;
  background-size: 48px 48px;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}

.container{
  background: #fff8f4; /* soft warm container over beige */
  width:100%;
  max-width:520px;
  padding:28px;
  border-radius:16px;
  text-align:center;
  box-shadow:0 10px 25px rgba(0,0,0,.12);
  border: 1px solid rgba(0,0,0,0.04);
}

h1{
  color:#4a3b3b;
  margin-bottom:14px;
  font-size:1.6rem;
}

p{ color:#5a4f4f; margin-bottom:12px; }

button{
  padding:10px 18px;
  border:none;
  border-radius:8px;
  cursor:pointer;
  margin:6px;
  font-size:15px;
  transition:.12s transform;
}

.oui{ background:#b76b84; color:white; }
.non{ background:#c06b4a; color:white; }
.secondary{ background:transparent; border:1px solid rgba(0,0,0,0.06); }
button:hover{ transform:scale(1.03); }

#heures{ display:none; margin-top:18px; text-align:left; }
select{ width:100%; padding:10px; border-radius:8px; margin-bottom:12px; font-size:1rem; border:1px solid rgba(0,0,0,0.06); background:#fffefc; }

#message{ margin-top:15px; font-weight:700; color:#2e7d32; }
#message.error{ color:#c92b2b; }
#reserved-actions{ margin-top:12px; }
.sr-only{ position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }

.cinema-row{ margin-top:12px; display:flex; gap:8px; justify-content:center; }
.cinema-btn{ background:#6b8f6b; color:white; padding:8px 12px; border-radius:8px; }
</style>

</head>
<body>

<div class="container" lang="fr">

<h1>Réservation</h1>

<p id="date">Date proposée : <time id="date-time" datetime=""></time></p>

<p>Souhaitez-vous réserver un créneau ?</p>

<div>
  <button id="btnOui" type="button" class="oui">Oui</button>
  <button id="btnNon" type="button" class="non">Non</button>
</div>

<!-- Quick action: Cinema Spider-Man -->
<div class="cinema-row">
  <button id="btnCinema" type="button" class="cinema-btn">Rendez‑vous cinéma — Spider‑Man</button>
  <button id="btnCinemaFill" type="button" class="secondary">Proposer 18 / 19 / 20</button>
</div>

<div id="heures" aria-hidden="true">
  <label for="heure">Choisissez un créneau</label>
  <select id="heure" name="heure" aria-describedby="heure-help">
    <option value="" disabled selected>-- Choisir une heure --</option>
    <option value="18:00">18h00</option>
    <option value="19:00">19h00</option>
    <option value="20:00">20h00</option>
  </select>
  <div id="heure-help" class="sr-only">Utilisez les flèches pour choisir l'heure et cliquez sur Valider.</div>
  <div style="text-align:right;">
    <button id="btnValider" type="button" class="oui">Valider</button>
  </div>
</div>

<div id="message" role="status" aria-live="polite"></div>

<div id="reserved-actions" style="display:none;" aria-hidden="true">
  <button id="btnModifier" type="button" class="oui">Modifier</button>
  <button id="btnAnnuler" type="button" class="non">Annuler</button>
</div>

</div>

<script>
/* Retourne le 2e mercredi d'un mois donné */
function secondWednesdayOfMonth(year, month){
  const first = new Date(year, month, 1);
  const firstDay = first.getDay(); // 0 = dimanche
  const target = 3; // mercredi
  const delta = (target - firstDay + 7) % 7;
  const firstWed = 1 + delta;
  const secondWed = firstWed + 7;
  return new Date(year, month, secondWed);
}

function getNextSecondWednesday(from = new Date()){
  let year = from.getFullYear();
  let month = from.getMonth();
  let candidate = secondWednesdayOfMonth(year, month);
  const today = new Date(from.getFullYear(), from.getMonth(), from.getDate());
  if (candidate <= today){
    month += 1;
    if (month > 11){ month = 0; year += 1; }
    candidate = secondWednesdayOfMonth(year, month);
  }
  return candidate;
}

/* DOM refs */
const dateTimeEl = document.getElementById('date-time');
const btnOui = document.getElementById('btnOui');
const btnNon = document.getElementById('btnNon');
const btnValider = document.getElementById('btnValider');
const heuresWrap = document.getElementById('heures');
const heureSelect = document.getElementById('heure');
const messageEl = document.getElementById('message');
const reservedActions = document.getElementById('reserved-actions');
const btnModifier = document.getElementById('btnModifier');
const btnAnnuler = document.getElementById('btnAnnuler');
const btnCinema = document.getElementById('btnCinema');
const btnCinemaFill = document.getElementById('btnCinemaFill');

const STORAGE_KEY = 'reservation';
let pendingTitle = '';

/* Initialize date display */
function afficherProchaineDate(){
  const mercredi = getNextSecondWednesday();
  dateTimeEl.textContent = mercredi.toLocaleDateString('fr-FR');
  dateTimeEl.setAttribute('datetime', mercredi.toISOString().split('T')[0]);
}
afficherProchaineDate();

/* Persistence helpers */
function saveReservation(res){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(res)); }
  catch(e){ console.warn('Impossible de sauvegarder la réservation:', e); }
}
function loadReservation(){
  try{ const raw = localStorage.getItem(STORAGE_KEY); return raw ? JSON.parse(raw) : null; }
  catch(e){ console.warn('Impossible de lire la réservation:', e); return null; }
}
function clearReservation(){ try{ localStorage.removeItem(STORAGE_KEY); } catch(e){ console.warn('Impossible de supprimer la réservation:', e); } }

/* UI */
function showHours(title){
  pendingTitle = title || '';
  heuresWrap.style.display = 'block';
  heuresWrap.setAttribute('aria-hidden', 'false');
  messageEl.classList.remove('error');
  messageEl.textContent = '';
  reservedActions.style.display = 'none';
  reservedActions.setAttribute('aria-hidden', 'true');
  setTimeout(()=>{ heureSelect.focus(); }, 50);
}
function hideHours(){
  heuresWrap.style.display = 'none';
  heuresWrap.setAttribute('aria-hidden', 'true');
  messageEl.classList.remove('error');
  messageEl.textContent = 'Aucune réservation sélectionnée.';
  reservedActions.style.display = 'none';
  reservedActions.setAttribute('aria-hidden', 'true');
}

function confirmReservation(){
  const value = heureSelect.value;
  if (!value){ messageEl.classList.add('error'); messageEl.textContent = 'Veuillez choisir un créneau avant de valider.'; return; }
  messageEl.classList.remove('error');
  const dateText = dateTimeEl.textContent;
  const hourText = heureSelect.options[heureSelect.selectedIndex].text;
  const dateISO = dateTimeEl.getAttribute('datetime') || new Date().toISOString().split('T')[0];
  const reservation = {
    title: pendingTitle || 'Réservation',
    dateText, dateISO,
    hourValue: value, hourText,
    createdAt: new Date().toISOString()
  };
  saveReservation(reservation);
  renderReservation(reservation);
}

function renderReservation(reservation){
  if (!reservation) return;
  messageEl.classList.remove('error');
  const title = reservation.title ? reservation.title + ' — ' : '';
  messageEl.innerHTML = `✅ ${title}Votre réservation est confirmée pour le <strong>${reservation.dateText}</strong> à <strong>${reservation.hourText}</strong>.`;
  heuresWrap.style.display = 'none';
  heuresWrap.setAttribute('aria-hidden', 'true');
  reservedActions.style.display = 'block';
  reservedActions.setAttribute('aria-hidden', 'false');
}

function cancelReservation(){ clearReservation(); messageEl.classList.remove('error'); messageEl.textContent = 'Votre réservation a été annulée.'; reservedActions.style.display = 'none'; reservedActions.setAttribute('aria-hidden', 'true'); }

function initFromStorage(){ const saved = loadReservation(); if (saved){ renderReservation(saved); for (let i=0;i<heureSelect.options.length;i++){ if (heureSelect.options[i].value === saved.hourValue){ heureSelect.selectedIndex = i; break; } } } }

/* Events */
btnOui.addEventListener('click', ()=>{ const saved = loadReservation(); if (saved){ for (let i=0;i<heureSelect.options.length;i++){ if (heureSelect.options[i].value === saved.hourValue){ heureSelect.selectedIndex = i; break; } } } showHours(''); });
btnNon.addEventListener('click', hideHours);
btnValider.addEventListener('click', confirmReservation);
btnModifier.addEventListener('click', ()=>{ const s = loadReservation(); if (s){ for (let i=0;i<heureSelect.options.length;i++){ if (heureSelect.options[i].value === s.hourValue){ heureSelect.selectedIndex = i; break; } } } showHours(s ? s.title : ''); });
btnAnnuler.addEventListener('click', cancelReservation);

// Cinema quick actions
btnCinema.addEventListener('click', ()=>{ // prefill for Spider-Man and show hours
  // ensure the heure options include 18/19/20
  pendingTitle = 'Cinéma — Spider‑Man';
  // select first option by default
  for (let i=0;i<heureSelect.options.length;i++){ if (heureSelect.options[i].value === '18:00'){ heureSelect.selectedIndex = i; break; } }
  showHours(pendingTitle);
});
btnCinemaFill.addEventListener('click', ()=>{
  // show hours for cinema without setting title
  pendingTitle = 'Cinéma — Spider‑Man';
  // ensure options are 18/19/20 (they already are)
  showHours(pendingTitle);
});

heureSelect.addEventListener('keydown', function(e){ if (e.key === 'Enter'){ e.preventDefault(); confirmReservation(); } });

initFromStorage();
</script>

</body>
</html>
