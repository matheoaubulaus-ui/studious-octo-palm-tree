<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Réservation du Mercredi</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:linear-gradient(135deg,#4facfe,#00f2fe);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.container{
    background:#fff;
    width:100%;
    max-width:420px;
    padding:30px;
    border-radius:15px;
    text-align:center;
    box-shadow:0 10px 25px rgba(0,0,0,.2);
}

h1{
    color:#333;
    margin-bottom:15px;
    font-size:1.5rem;
}

p{
    margin-bottom:12px;
    color:#555;
}

button{
    padding:12px 25px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    margin:5px;
    font-size:16px;
    transition:.15s transform;
}

.oui{
    background:#28a745;
    color:white;
}

.non{
    background:#dc3545;
    color:white;
}

button:hover{
    transform:scale(1.03);
}

#heures{
    display:none;
    margin-top:20px;
    text-align:left;
}

select{
    width:100%;
    padding:10px;
    border-radius:8px;
    margin-bottom:12px;
    font-size:1rem;
}

#message{
    margin-top:15px;
    font-weight:bold;
    color:#28a745;
}

/* error style */
#message.error{
    color:#dc3545;
}

/* reserved actions */
#reserved-actions{
    margin-top:12px;
}

/* visually-hidden helper for accessibility if needed */
.sr-only{
    position:absolute;
    width:1px;
    height:1px;
    padding:0;
    margin:-1px;
    overflow:hidden;
    clip:rect(0,0,0,0);
    white-space:nowrap;
    border:0;
}
</style>

</head>
<body>

<div class="container" lang="fr">

<h1>Réservation</h1>

<p id="date">Date proposée : <time id="date-time" datetime=""></time></p>

<p>Souhaitez-vous réserver un créneau ?</p>

<div>
  <button id="btnOui" type="button" class="oui">Oui</button>
  <button id="btnNon" type="button" class="non">Non</button>
</div>

<div id="heures" aria-hidden="true">
  <label for="heure">Choisissez un créneau</label>
  <select id="heure" name="heure" aria-describedby="heure-help">
    <option value="" disabled selected>-- Choisir une heure --</option>
    <option value="22:00">22h00</option>
    <option value="23:00">23h00</option>
    <option value="00:00">00h00</option>
  </select>
  <div id="heure-help" class="sr-only">Utilisez les flèches pour choisir l'heure et cliquez sur Valider.</div>
  <div style="text-align:right;">
    <button id="btnValider" type="button" class="oui">Valider</button>
  </div>
</div>

<div id="message" role="status" aria-live="polite"></div>

<div id="reserved-actions" style="display:none;" aria-hidden="true">
  <button id="btnModifier" type="button" class="oui">Modifier</button>
  <button id="btnAnnuler" type="button" class="non">Annuler</button>
</div>

</div>

<script>
/* Utility: compute next Wednesday (Wednesday = 3 when Sunday = 0) */
function getNextWednesday(from = new Date()){
  const date = new Date(from.getFullYear(), from.getMonth(), from.getDate());
  const targetDay = 3; // Wednesday
  let delta = (targetDay - date.getDay() + 7) % 7;
  if (delta === 0) delta = 7; // next Wednesday (not today)
  date.setDate(date.getDate() + delta);
  return date;
}

/* DOM references */
const dateTimeEl = document.getElementById('date-time');
const btnOui = document.getElementById('btnOui');
const btnNon = document.getElementById('btnNon');
const btnValider = document.getElementById('btnValider');
const heuresWrap = document.getElementById('heures');
const heureSelect = document.getElementById('heure');
const messageEl = document.getElementById('message');
const reservedActions = document.getElementById('reserved-actions');
const btnModifier = document.getElementById('btnModifier');
const btnAnnuler = document.getElementById('btnAnnuler');

const STORAGE_KEY = 'reservation';

/* Initialize date display */
function afficherProchaineDate(){
  const mercredi = getNextWednesday();
  // human-readable for users and machine-readable datetime attribute (YYYY-MM-DD)
  dateTimeEl.textContent = mercredi.toLocaleDateString('fr-FR');
  dateTimeEl.setAttribute('datetime', mercredi.toISOString().split('T')[0]);
}
afficherProchaineDate();

/* Persistence helpers */
function saveReservation(res){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(res));
  }catch(e){
    console.warn('Impossible de sauvegarder la réservation:', e);
  }
}

function loadReservation(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : null;
  }catch(e){
    console.warn('Impossible de lire la réservation:', e);
    return null;
  }
}

function clearReservation(){
  try{
    localStorage.removeItem(STORAGE_KEY);
  }catch(e){
    console.warn('Impossible de supprimer la réservation:', e);
  }
}

/* UI actions */
function showHours(){
  heuresWrap.style.display = 'block';
  heuresWrap.setAttribute('aria-hidden', 'false');
  messageEl.classList.remove('error');
  messageEl.textContent = '';
  reservedActions.style.display = 'none';
  reservedActions.setAttribute('aria-hidden', 'true');
  // focus the select so keyboard users can continue
  setTimeout(() => { heureSelect.focus(); }, 50);
}

function hideHours(){
  heuresWrap.style.display = 'none';
  heuresWrap.setAttribute('aria-hidden', 'true');
  messageEl.classList.remove('error');
  messageEl.textContent = 'Aucune réservation sélectionnée.';
  reservedActions.style.display = 'none';
  reservedActions.setAttribute('aria-hidden', 'true');
}

/* Validate and confirm */
function confirmReservation(){
  const value = heureSelect.value;
  if (!value){
    messageEl.classList.add('error');
    messageEl.textContent = 'Veuillez choisir un créneau avant de valider.';
    return;
  }
  messageEl.classList.remove('error');
  // display the text content of the time element (safe)
  const dateText = dateTimeEl.textContent;
  // display user-friendly hour text (the option's text)
  const hourText = heureSelect.options[heureSelect.selectedIndex].text;
  const dateISO = dateTimeEl.getAttribute('datetime') || new Date().toISOString().split('T')[0];
  const reservation = {
    dateText: dateText,
    dateISO: dateISO,
    hourValue: value,
    hourText: hourText,
    createdAt: new Date().toISOString()
  };
  saveReservation(reservation);
  renderReservation(reservation);
}

function renderReservation(reservation){
  if (!reservation) return;
  messageEl.classList.remove('error');
  messageEl.innerHTML = `✅ Votre réservation est confirmée pour le <strong>${reservation.dateText}</strong> à <strong>${reservation.hourText}</strong>.`;
  // hide selector
  heuresWrap.style.display = 'none';
  heuresWrap.setAttribute('aria-hidden', 'true');
  // show actions
  reservedActions.style.display = 'block';
  reservedActions.setAttribute('aria-hidden', 'false');
}

function cancelReservation(){
  clearReservation();
  messageEl.classList.remove('error');
  messageEl.textContent = 'Votre réservation a été annulée.';
  reservedActions.style.display = 'none';
  reservedActions.setAttribute('aria-hidden', 'true');
}

/* Load saved reservation on init */
function initFromStorage(){
  const saved = loadReservation();
  if (saved){
    // if the saved date differs from computed next wednesday, still show saved date
    renderReservation(saved);
    // set select to saved hour to allow quick modification
    for (let i=0;i<heureSelect.options.length;i++){
      if (heureSelect.options[i].value === saved.hourValue){
        heureSelect.selectedIndex = i;
        break;
      }
    }
  }
}

/* Event listeners */
btnOui.addEventListener('click', () => {
  // If there is a saved reservation, allow modifying it
  const saved = loadReservation();
  if (saved){
    // pre-select saved hour
    for (let i=0;i<heureSelect.options.length;i++){
      if (heureSelect.options[i].value === saved.hourValue){
        heureSelect.selectedIndex = i;
        break;
      }
    }
  }
  showHours();
});
btnNon.addEventListener('click', hideHours);
btnValider.addEventListener('click', confirmReservation);
btnModifier.addEventListener('click', () => {
  const saved = loadReservation();
  if (saved){
    // pre-select saved hour
    for (let i=0;i<heureSelect.options.length;i++){
      if (heureSelect.options[i].value === saved.hourValue){
        heureSelect.selectedIndex = i;
        break;
      }
    }
  }
  showHours();
});
btnAnnuler.addEventListener('click', cancelReservation);

/* keyboard: allow Enter on select to confirm (optional) */
heureSelect.addEventListener('keydown', function(e){
  if (e.key === 'Enter'){
    e.preventDefault();
    confirmReservation();
  }
});

/* Run init */
initFromStorage();
</script>

</body>
</html>
